services:

    # =========================
    # NGINX (HTTP entrypoint)
    # =========================
    nginx:
        image: nginx:1.25-alpine
        container_name: voting_nginx
        ports:
            - "8080:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www/html
        depends_on:
            - app

    # =========================
    # PHP-FPM (Symfony API)
    # =========================
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: voting_app
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV: dev
            DATABASE_URL: postgres://app:app@db:5432/voting
            REDIS_HOST: redis
            REDIS_PORT: 6379
            MESSENGER_TRANSPORT_DSN: amqp://app:app@rabbitmq:5672/%2f/messages
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            rabbitmq:
                condition: service_healthy

    # =========================
    # WORKER (Symfony Messenger)
    # =========================
    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: voting_worker
        command: php bin/console messenger:consume async -vv
        volumes:
            - .:/var/www/html
        environment:
            APP_DEBUG: 0
            APP_ENV: dev
            DATABASE_URL: postgres://app:app@db:5432/voting
            REDIS_HOST: redis
            REDIS_PORT: 6379
            MESSENGER_TRANSPORT_DSN: amqp://app:app@rabbitmq:5672/%2f/messages
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            rabbitmq:
                condition: service_healthy

    # =========================
    # POSTGRESQL
    # =========================
    db:
        image: postgres:16-alpine
        container_name: voting_db
        environment:
            POSTGRES_DB: voting
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5433:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d voting -U app"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    # =========================
    # REDIS
    # =========================
    redis:
        image: redis:7-alpine
        container_name: voting_redis
        ports:
            - "6379:6379"

    # =========================
    # RABBITMQ
    # =========================
    rabbitmq:
        image: rabbitmq:4.3.6-management
        container_name: voting_rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: app
            RABBITMQ_DEFAULT_PASS: app
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
  # =========================
  # WEBSOCKET
  # =========================
    websocket:
      build:
        context: .
        dockerfile: docker/php/Dockerfile

      container_name: voting_websocket

      working_dir: /var/www/html

      command: php bin/websocket-server.php start

      volumes:
        - .:/var/www/html

      depends_on:
        redis:
          condition: service_started

      ports:
        - "8100:8081"

      restart: unless-stopped

volumes:
    db_data:
    rabbitmq_data:
