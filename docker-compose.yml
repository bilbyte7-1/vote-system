version: "3.9"

services:

    # =========================
    # NGINX (HTTP entrypoint)
    # =========================
    nginx:
        image: nginx:1.25-alpine
        container_name: voting_nginx
        ports:
            - "8080:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www/html
        depends_on:
            - app

    # =========================
    # PHP-FPM (Symfony API)
    # =========================
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: voting_app
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV: dev
            DATABASE_URL: postgres://app:app@db:5432/voting
            REDIS_URL: redis://redis:6379
        depends_on:
            - db
            - redis

    # =========================
    # WORKER (Symfony Messenger)
    # =========================
    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: voting_worker
        command: php bin/console messenger:consume async -vv
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV: dev
            DATABASE_URL: postgres://app:app@db:5432/voting
            REDIS_URL: redis://redis:6379
        depends_on:
            - db
            - redis

    # =========================
    # POSTGRESQL (source of truth)
    # =========================
    db:
        image: postgres:16-alpine
        container_name: voting_db
        environment:
            POSTGRES_DB: voting
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

    # =========================
    # REDIS (cache + pub/sub)
    # =========================
    redis:
        image: redis:7-alpine
        container_name: voting_redis
        ports:
            - "6379:6379"

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
    db_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
