version: "3.9"

services:

    # =========================
    # NGINX (HTTP entrypoint)
    # =========================
    nginx:
        image: nginx:1.25-alpine
        container_name: voting_nginx
        ports:
            - "8080:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www/html
        depends_on:
            - app

    # =========================
    # PHP-FPM (Symfony API)
    # =========================
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: voting_app
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV: dev
            DATABASE_URL: postgres://app:app@db:5432/voting
            REDIS_URL: redis://redis:6379
        depends_on:
            - db
            - redis

    # =========================
    # WORKER (Symfony Messenger)
    # =========================
    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: voting_worker
        command: php bin/console messenger:consume async -vv
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV: dev
            DATABASE_URL: postgres://app:app@db:5432/voting
            REDIS_URL: redis://redis:6379
        depends_on:
            - db
            - redis

    # =========================
    # POSTGRESQL (source of truth)
    # =========================
    db:
        image: postgres:16-alpine
        container_name: voting_db
        environment:
            POSTGRES_DB: voting
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

    # =========================
    # REDIS (cache + pub/sub)
    # =========================
    redis:
        image: redis:7-alpine
        container_name: voting_redis
        ports:
            - "6379:6379"

volumes:
    db_data:
