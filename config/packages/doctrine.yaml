doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '16.0.0'

        types:
            user_id: App\Infrastructure\DoctrineRepository\Type\User\UserIdType
            email: App\Infrastructure\DoctrineRepository\Type\User\EmailType
            password: App\Infrastructure\DoctrineRepository\Type\User\PasswordType
            refresh_token_id: App\Infrastructure\DoctrineRepository\Type\RefreshToken\RefreshTokenIdType
            refresh_token_hash: App\Infrastructure\DoctrineRepository\Type\RefreshToken\RefreshTokenHashType
            vote_session_id: App\Infrastructure\DoctrineRepository\Type\VoteSession\VoteSessionIdType
            owner_id: App\Infrastructure\DoctrineRepository\Type\VoteSession\OwnerIdType

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            User:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/packages/doctrine/User'
                prefix: 'App\Domain\User'
                alias: User

            RefreshToken:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/packages/doctrine/RefreshToken'
                prefix: 'App\Domain\RefreshToken'
                alias: RefreshToken

            VoteSession:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/packages/doctrine/VoteSession'
                prefix: 'App\Domain\VoteSession'
                alias: VoteSession

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
