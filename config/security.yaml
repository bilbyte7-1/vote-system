security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        vote_system_jwt:
            id: App\Infrastructure\Security\Jwt\SecurityUserProvider

    firewalls:
        users_auth:
            pattern: ^/users/auth$
            stateless: true

        api:
            pattern: ^/api
            stateless: true
            provider: vote_system_jwt
            jwt: ~

    access_control:
        - { path: ^/users/register$, roles: PUBLIC_ACCESS, methods: [ POST ] }
        - { path: ^/users/auth$, roles: PUBLIC_ACCESS, methods: [ POST ] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
