# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    refresh_token.ttl: 2592000

when@test:
    imports:
        - { resource: 'services_test.yaml' }
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    Redis:
        class: Redis
        calls:
            -   connect:
                    - '%env(REDIS_HOST)%'
                    - '%env(int:REDIS_PORT)%'

    App\Infrastructure\Security\LexikAccessTokenIssuer:
        arguments:
            $tokenManager: '@lexik_jwt_authentication.jwt_manager'

    App\Application\RefreshToken\RefreshTokenInitializer:
        arguments:
            $ttl: '%refresh_token.ttl%'

    App\Infrastructure\Validation\ErrorResponseListener:
        tags:
            - name: kernel.event_listener
              event: kernel.exception
              method: onKernelException

    App\Infrastructure\Validation\RequestValidationListener:
        tags:
            -   name: kernel.event_listener
                event: kernel.request
                method: onKernelRequest

    App\Infrastructure\Validation\ConcreteValidationStrategySelector:
        arguments:
            - !service_locator
                users_register: '@App\Infrastructure\Validation\Register\RegisterValidationStrategy'
                users_login: '@App\Infrastructure\Validation\Authentication\AuthenticationValidationStrategy'
                users_refresh: '@App\Infrastructure\Validation\Authentication\RefreshTokenValidationStrategy'
                vote_sessions_start: '@App\Infrastructure\Validation\VoteSessionStart\VoteSessionStartValidationStrategy'

    App\Application\Messages\VoteSessionStartedHandler:
        tags:
            - { name: messenger.message_handler }
